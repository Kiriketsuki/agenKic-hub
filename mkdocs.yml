site_name: agenKic sKills
site_description: A public hub of agent skills, workflows, harness configs, and patterns.
site_url: https://kiriketsuki.github.io/agenKic-sKills/
repo_url: https://github.com/Kiriketsuki/agenKic-sKills
repo_name: Kiriketsuki/agenKic-sKills

theme:
  name: material
  logo: assets/chrysaki-mark.svg
  favicon: assets/chrysaki-favicon.svg
  palette:
    scheme: chrysaki
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/chrysaki.css

copyright: agenKic sKills · MIT · built by Kiriketsuki

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kiriketsuki/agenKic-sKills
      name: agenKic-sKills
    - icon: fontawesome/solid/hexagon-nodes
      link: https://github.com/Kiriketsuki/chrysaki
      name: chrysaki design system

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Setup:
      - Install: setup/install.md
      - Manual symlinks: setup/symlinks.md
      - Harnesses: setup/harnesses.md
  - Skills: skills/index.md
  - Workflows: workflows/index.md
  - Patterns:
      - Overview: patterns/index.md
      - Debugging protocol: patterns/debugging-protocol.md
      - Model tiering: patterns/model-tiering.md
      - Council patterns: patterns/council-patterns.md
      - Gherkin and specs: patterns/gherkin-and-specs.md
      - Claude Code hooks: patterns/hooks.md
      - Authoring workflows: patterns/authoring-workflows.md
      - Clip-path borders: patterns/clip-path-borders.md
