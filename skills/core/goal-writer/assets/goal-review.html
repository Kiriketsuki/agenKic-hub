<meta charset="utf-8">
<title>Goal Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
:root{--bg:#f4efe4;--card:#fbf8f1;--ink:#1f2a33;--soft:#5d6873;--line:#cfc6b4;--grid:rgba(46,84,120,.07);--blue:#2e5478;--good:#2f6b46;--goodbg:#e2eee4;--warn:#8a5a12;--warnbg:#f6ead0;--bad:#9b2f22;--badbg:#f6dfda}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a20;--card:#1b232b;--ink:#e8e2d4;--soft:#9aa5ae;--line:#33404b;--grid:rgba(140,180,220,.06);--blue:#8fb5d9;--good:#8fcfa3;--goodbg:#1d3326;--warn:#e2b867;--warnbg:#382c15;--bad:#f0998b;--badbg:#3b1f1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a20;--card:#1b232b;--ink:#e8e2d4;--soft:#9aa5ae;--line:#33404b;--grid:rgba(140,180,220,.06);--blue:#8fb5d9;--good:#8fcfa3;--goodbg:#1d3326;--warn:#e2b867;--warnbg:#382c15;--bad:#f0998b;--badbg:#3b1f1b;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1{font:400 44px/1 "Instrument Serif",Georgia,serif;margin:0}
h2{font:600 13px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
p{margin:0}.sub{color:var(--soft);max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
textarea{width:100%;box-sizing:border-box;min-height:150px;font:13px/1.5 "IBM Plex Mono",monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:500 14px "IBM Plex Sans",sans-serif;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.verdict{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stamp{font:400 30px/1 "Instrument Serif",serif;padding:10px 18px;border:2px solid;border-radius:6px;transform:rotate(-2deg)}
.stamp.ok{color:var(--good);border-color:var(--good)}.stamp.no{color:var(--bad);border-color:var(--bad)}
.why{display:grid;gap:4px;color:var(--soft)}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}.bar.over i{background:var(--bad)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.part{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;border:1px solid var(--line)}
.part b{display:block}.part span{color:var(--soft);font-size:13px}
.dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 13px "IBM Plex Mono",monospace}
.yes .dot{background:var(--goodbg);color:var(--good)}.no .dot{background:var(--badbg);color:var(--bad)}.opt .dot{background:var(--warnbg);color:var(--warn)}
figure{margin:0}figcaption{color:var(--soft);font-size:13px;margin-top:6px}
.turn{display:grid;gap:0}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:8px 0;position:relative;min-width:0}
.step:not(.last)::before{content:"";position:absolute;left:14px;top:38px;bottom:-8px;border-left:1.5px solid var(--line)}
.step>div{min-width:0}
.num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);background:var(--card);display:grid;place-items:center;font:600 13px "IBM Plex Mono",monospace;position:relative;z-index:1}
.step b{display:block;font-weight:600}.step .d{color:var(--soft);font-size:13px;overflow-wrap:anywhere}.step .d.bad{color:var(--bad)}
.cycle{position:relative;border:1.5px dashed var(--warn);border-radius:10px;padding:18px 12px 6px;margin:10px 0 4px}
.cycle>.lbl{position:absolute;top:-10px;left:12px;background:var(--card);padding:0 6px;font:600 12px "IBM Plex Sans",sans-serif;color:var(--warn);letter-spacing:.04em;text-transform:uppercase}
.pts{display:grid;gap:5px;margin-top:8px}
.pt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:6px 10px;border:1px solid var(--line);border-left-width:4px;border-radius:6px;font-size:13px;background:var(--bg)}
.pt.chat{border-left-color:var(--good)}.pt.you{border-left-color:var(--warn)}.pt.none{border-left-color:var(--bad)}
.pt .t{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.chip{font:500 12px "IBM Plex Mono",monospace;padding:1px 8px;border-radius:10px;white-space:nowrap}
.chip.chat{background:var(--goodbg);color:var(--good)}.chip.you{background:var(--warnbg);color:var(--warn)}.chip.none{background:var(--badbg);color:var(--bad)}
.outs{display:grid;gap:5px;margin-top:8px}
.out{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.out .ar{color:var(--soft)}.out .r{font-weight:600}
.out.good .r{color:var(--good)}.out.warn .r{color:var(--warn)}.out.bad .r{color:var(--bad)}.out.off{opacity:.55}.out.missing{border-color:var(--bad)}.out.missing .c{color:var(--bad)}
@media (max-width:520px){.out{grid-template-columns:1fr}.out .ar{display:none}.cycle{padding-inline:6px}.step{gap:8px}.chip{white-space:normal}}
.clauses{display:grid;gap:10px}
.clauses{gap:6px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.grp{display:grid;gap:6px;align-content:start;padding:12px;border-radius:8px;border:1px dashed var(--line);min-width:0}
.grp.human{background:var(--warnbg)}
.grp h3{margin:0;font:600 15px "IBM Plex Sans",sans-serif;display:flex;gap:8px;align-items:center}
.grp h3 span{font:500 12px "IBM Plex Mono",monospace;color:var(--soft);border:1px solid var(--line);border-radius:10px;padding:0 7px}
.grp .cl{background:var(--card)}.key{color:var(--soft);font-size:13px;margin-bottom:4px}.k{font-weight:600}.k.clear{color:var(--good)}.k.check{color:var(--warn)}.k.vague{color:var(--bad)}
.cl{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:baseline;padding:8px 12px;border:1px solid var(--line);border-radius:8px;border-left-width:5px;font-size:14px;cursor:pointer}
.cl input{margin:0;transform:translateY(2px)}
.cl.clear{border-left-color:var(--good)}.cl.check{border-left-color:var(--warn)}.cl.vague,.cl.escape{border-left-color:var(--bad)}
.n{font:500 13px "IBM Plex Mono",monospace;color:var(--soft)}
.tag{font:600 12px "IBM Plex Sans",sans-serif;padding:3px 9px;border-radius:20px;white-space:nowrap}
.clear .tag{background:var(--goodbg);color:var(--good)}.check .tag{background:var(--warnbg);color:var(--warn)}.vague .tag,.escape .tag{background:var(--badbg);color:var(--bad)}
.cl p{min-width:0;overflow-wrap:anywhere}.cl small{display:block;color:var(--soft);margin-top:4px}
mark{background:var(--badbg);color:var(--bad);border-radius:3px;padding:0 2px}
label.tick{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--soft);margin-top:8px;cursor:pointer}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lists ul{margin:0;padding-left:18px;display:grid;gap:4px}
.empty{color:var(--soft);font-style:italic}
.sess{display:grid;gap:14px}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps li{font:500 12px "IBM Plex Mono",monospace;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:var(--soft)}
.steps li.on{background:var(--blue);border-color:var(--blue);color:var(--bg)}.steps li.done{color:var(--good);border-color:var(--good)}
.banner{padding:10px 12px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-weight:500;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner.good{background:var(--goodbg);color:var(--good)}.banner.bad{background:var(--badbg);color:var(--bad)}
.qs{display:grid;gap:10px}
.q{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--bg);min-width:0}
.q.done{border-left:4px solid var(--good)}.q.open{border-left:4px solid var(--warn)}
.q b{overflow-wrap:anywhere}.qwhy{color:var(--soft);font-size:13px}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;overflow-wrap:anywhere}.opt input{margin-top:4px}
.rec{font:600 11px "IBM Plex Sans",sans-serif;color:var(--good);background:var(--goodbg);border-radius:10px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.q input[type=text],.prop textarea{width:100%;box-sizing:border-box;font:14px "IBM Plex Sans",sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.prop textarea{min-height:70px;resize:vertical}
.ans{color:var(--good);font-size:14px;overflow-wrap:anywhere}.ans span{color:var(--soft);font-size:12px}
pre.final{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 "IBM Plex Mono",monospace;background:var(--bg);border:1.5px solid var(--good);border-radius:8px;padding:12px;margin:0}
.vers{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px}.vers small{color:var(--soft)}
details summary{cursor:pointer;color:var(--soft);font-size:13px}
.err{color:var(--bad);font-size:13px}
</style>

<div class="wrap">
  <header>
    <h1>Goal Review</h1>
    <p class="sub">Paste a goal before you start it. This page shows whether someone else could tell, from the work alone, when it is done.</p>
  </header>

  <section class="card sess" id="sess" hidden aria-live="polite"></section>

  <section class="card">
    <h2 id="srch">The goal</h2>
    <textarea id="src" spellcheck="false" aria-label="Goal text"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="main" id="go">Review</button>
      <button id="ex">Load an example</button>
      <button id="clr">Clear</button>
    </div>
  </section>

  <section class="card verdict" aria-live="polite">
    <div class="stamp no" id="stamp">Not Ready</div>
    <div class="why" id="why"></div>
  </section>

  <section class="card">
    <h2>Length</h2>
    <p id="len"></p>
    <div class="bar" id="lenbar"><i></i></div>
  </section>

  <section class="card">
    <h2>Does it say all six things?</h2>
    <div class="parts" id="parts"></div>
  </section>

  <section class="card">
    <h2>How it ends</h2>
    <figure class="flow" id="flow"></figure>
  </section>

  <section class="card">
    <h2>Finish line: who can close each point</h2>
    <div class="clauses" id="clauses"></div>
  </section>

  <section class="card lists">
    <div><h2>Rules while working</h2><ul id="rules"></ul></div>
    <div><h2>Never do</h2><ul id="never"></ul></div>
  </section>
</div>

<script>
const EXAMPLE = `/goal Make checkout pages load fast without breaking anything.
DONE WHEN:
1. The checkout benchmark shows p95 under 120 ms, and the result line is shown in the chat.
2. The full test suite passes with 0 failed, and the summary line is shown in the chat.
3. No public API response changes: the API compare test passes.
4. The user signs off the new numbers in the chat.
BLOCKED: if no change gets p95 under 120 ms after 5 tries, stop and report what was tried, the numbers, and what input would help.
HOW: work only in the checkout service and its tests. After each try, record the number and pick the next idea from the slowest step.
NEVER: change the benchmark, skip tests, or touch other services.`;

const KEY = "goal-review-v2";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ticks = {};
try { ticks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { ticks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ticks)); } catch (e) {} };

const VAGUE = /(?<![\w./-])(better|improve[sd]?|good|nice|clean(er)?|robust|properly|works?|working|as needed|appropriate|reasonable|where possible|if possible|etc|follows? the|aligned|mostly|enough|fast(er)?|simple|simpler)(?![\w/-])/gi;
const ESCAPE = /\b(or (a|the) reason|unless (it|you) (decide|think)|at (your|its) discretion|if (you|it) (think|judge|decide)s?|or skip|or defer|best effort|where it makes sense|if time allows)\b/gi;
const COUNTED = /(\b\d+(\.\d+)?\s*(%|ms|s|gb|mb|kb|failed|open|blank|errors?|passed|rows?)?\b|rc=0|exits? 0|\bpass(es|ed)?\b|\bresult pass\b|\bshows?\b.+\bline\b|"[^"]+")/i;
const HUMAN = /(?<![\w./-])(the user|users?|you|human|a person|approv\w*|sign[- ]?off|signs? off|sees?|saw|seen|decides?|ruling|manual(ly)?|by hand|physical|on site|webhook|access|log ?in|password|secret|production deploy|deploy to production|real slack)(?![\w/-])/i;
const HEADS = [["done", /\bDONE WHEN\b\s*:?/i], ["blocked", /\bBLOCKED[A-Z ]*\b\s*:?/i], ["how", /\bHOW\b\s*:/], ["never", /\bNEVER\b\s*:/]];

function parse(t) {
  t = t.replace(/^\s*\/goal\s+/i, "").trim();
  const hits = [];
  for (const [k, re] of HEADS) { const m = re.exec(t); if (m) hits.push({k, i: m.index, j: m.index + m[0].length}); }
  hits.sort((a, b) => a.i - b.i);
  const out = {outcome: (hits.length ? t.slice(0, hits[0].i) : t).trim(), done: "", blocked: "", how: "", never: ""};
  hits.forEach((h, n) => { out[h.k] = t.slice(h.j, n + 1 < hits.length ? hits[n + 1].i : t.length).trim(); });
  let items = out.done.split(/(?:^|\s)\d+[.)]\s+/).map(s => s.trim()).filter(Boolean);
  if (!items.length && out.done) items = [out.done];
  out.items = items;
  return out;
}

function judge(c) {
  const e = c.match(ESCAPE), v = c.match(VAGUE);
  if (e) return {cls: "escape", tag: "Way out", note: "Lets the worker decide it is done without you.", words: e};
  if (v && !COUNTED.test(c)) return {cls: "vague", tag: "Vague", note: "Two people could disagree on whether this is true.", words: v};
  if (COUNTED.test(c)) return {cls: "clear", tag: "Clear", note: "Ends in a number or an exact result.", words: []};
  return {cls: "check", tag: "Check", note: "No number or exact result. Add one if you can.", words: []};
}

function hl(text, words) {
  let h = esc(text);
  [...new Set(words.map(w => w.toLowerCase()))].forEach(w => {
    h = h.replace(new RegExp("(?<![\\w./-])(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![\\w/-])", "gi"), "<mark>$1</mark>");
  });
  return h;
}

function parts(g, all) {
  const has = re => re.test(all);
  return [
    {ok: g.items.length > 0, name: "Finish line", say: "What must be true when the work is done."},
    {ok: g.items.some(c => COUNTED.test(c)), name: "Proof", say: "A number, test or result that shows it is true."},
    {ok: !!g.never || has(/\b(without|keep(ing)?|preserv|must not|do not|never)\b/i), name: "Must not break", say: "What has to stay working."},
    {ok: !!g.how || has(/\b(only|limit(ed)? to|scope|within)\b/i), name: "Where it may work", say: "Which files, tools or places are allowed."},
    {ok: has(/\b(after each|each (try|attempt)|next (try|idea|step)|retry|iterate|sweep)\b/i), name: "How it tries again", say: "How a failed try leads to the next one."},
    {ok: !!g.blocked || has(/\b(stuck|stop and report|if blocked)\b/i), name: "When to stop and ask", say: "When to give up and what to report."},
    {ok: has(/\b(shown|show|print(ed)?|report(ed)?|in the chat|line)\b/i), name: "Shown in the chat", say: "The checker only reads the chat, so proof must appear there."},
    {ok: has(/\b(\d+ (turns|tries|attempts|hours)|stop after)\b/i), name: "A turn or try limit", say: "Optional. Stops a goal that never ends.", optional: true}
  ];
}

// Finds the proof a point promises to put in the chat. The /goal checker reads only the chat.
const PROOF = /\b(?:the|a|its)\s+((?:[\w%<>=.-]+\s+){0,3}?(?:line|result|summary|output|table|count|number|list)s?(?:\s+(?:line|summary|table|output)s?)?)\b(?=[^.]*\b(?:shown|printed|posted|pasted|in the chat))/i;
function proof(c) {
  if (HUMAN.test(c)) return {who: "you", txt: "you: your reply in the chat"};
  const m = c.match(PROOF);
  if (m) return {who: "chat", txt: "needs: " + m[1].toLowerCase()};
  if (/\bin the chat\b/i.test(c)) return {who: "chat", txt: "needs: a line in the chat"};
  return {who: "none", txt: "checker cannot see this"};
}

const short = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;

function flow(g) {
  const pr = g.items.map(proof);
  const yours = pr.filter(p => p.who === "you").length;
  const nNever = g.never ? g.never.split(/[,.;]\s*|\bor\b/).filter(x => x.trim()).length : 0;
  const how = g.how ? short(g.how.split(/(?<=\.)\s+/)[0], 110) : "";
  const blockTrig = g.blocked ? short(g.blocked.split(/,\s*(?=stop)|\bstop\b/i)[0].trim(), 70) : "";
  const lim = (g.outcome + " " + g.done + " " + g.how + " " + g.blocked).match(/\b(?:stop after|after|within|at most)\s+(\d+)\s+(turns?|hours?)\b/i);
  const step = (n, title, detail, cls = "", extra = "", last = false) =>
    `<div class="step${last ? " last" : ""}"><div class="num">${n}</div><div><b>${title}</b>${detail ? `<div class="d ${cls}">${detail}</div>` : ""}${extra}</div></div>`;
  const pts = g.items.length
    ? `<div class="pts">${g.items.map((c, i) => `<div class="pt ${pr[i].who}"><span class="n">${i + 1}</span><span class="t">${esc(short(c, 90))}</span><span class="chip ${pr[i].who}">${pr[i].who === "chat" ? "✓ " : pr[i].who === "none" ? "✕ " : ""}${esc(pr[i].txt)}</span></div>`).join("")}</div>`
    : `<p class="empty">No DONE WHEN points, so the checker has nothing to check.</p>`;
  const out = (cls, cond, res) => `<div class="out ${cls}"><span class="c">${cond}</span><span class="ar">→</span><span class="r">${res}</span></div>`;
  const outs = `<div class="outs">
    ${out("good", "Every point has its proof in the chat", "Done. The goal clears.")}
    ${yours ? out("warn", `Only your ${yours === 1 ? "point is" : yours + " points are"} left`, "Claude asks you and waits. Your reply starts the next turn.") : out("off", "No point needs you", "Claude never has to wait for you.")}
    ${out("warn", "Claude's points are still open", "Next turn. Back to step 2.")}
    ${g.blocked ? out("bad", "BLOCKED: " + esc(blockTrig), "Stop. Report what was tried.") : out("bad missing", "No BLOCKED rule", "Claude never stops on its own.")}
    ${lim ? out("bad", `Limit: ${lim[1]} ${esc(lim[2])}`, "Stop.") : out("off", "No turn or try limit (optional)", "Only the rules above end it.")}
  </div>`;
  return `<div class="turn" role="img" aria-label="Order of one goal run: Claude takes the goal, tries an idea, prints proof in the chat, the checker reads the chat, then one of five outcomes follows.">
  ${step("1", "You start the goal", g.never ? `Claude holds ${g.items.length} point${g.items.length === 1 ? "" : "s"} and ${nNever} Never rule${nNever === 1 ? "" : "s"}. The Never rules apply to every turn.` : "No Never list: nothing fences the work.", g.never ? "" : "bad")}
  <div class="cycle"><span class="lbl">Each turn, repeats</span>
  ${step("2", "Claude tries the next idea", how ? "Inside the HOW rules: " + esc(how) : "No HOW rules: the scope is open.", how ? "" : "bad")}
  ${step("3", "Claude prints the proof in the chat", "A file or a passing run that is not printed in the chat does not count.")}
  ${step("4", "The turn ends. A small model reads the chat only", "It does not run commands or read files. It checks each point against what the chat shows.", "", pts)}
  ${step("5", "What happens next", "", "", outs, true)}
  </div></div>
  <figcaption>Green: the point names a line Claude prints. Amber: you close it. Red: the checker has nothing in the chat to read, so that point can never close.</figcaption>`;
}

function render() {
  const raw = $("src").value, all = raw.trim();
  if (!all) {
    $("stamp").className = "stamp no"; $("stamp").textContent = "Empty";
    $("why").innerHTML = "<p>Paste a goal, or load the example.</p>";
    ["parts", "clauses", "rules", "never", "flow"].forEach(id => $(id).innerHTML = "");
    $("len").textContent = ""; $("lenbar").firstElementChild.style.width = "0"; return;
  }
  const g = parse(all), len = all.length, ps = parts(g, all), js = g.items.map(judge);
  $("len").textContent = `${len.toLocaleString()} of 4,000 characters` + (len > 4000 ? ". Too long: the goal tool cuts it off." : ".");
  $("lenbar").className = "bar" + (len > 4000 ? " over" : "");
  $("lenbar").firstElementChild.style.width = Math.min(100, len / 40) + "%";
  $("parts").innerHTML = ps.map(p => `<div class="part ${p.ok ? "yes" : p.optional ? "opt" : "no"}"><div class="dot">${p.ok ? "✓" : p.optional ? "?" : "✕"}</div><div><b>${p.name}</b><span>${p.say}</span></div></div>`).join("");
  $("flow").innerHTML = flow(g);
  const sig = s => s.slice(0, 80);
  const row = i => {
    const c = g.items[i], j = js[i], k = sig(c);
    return `<label class="cl ${j.cls}" title="${j.note}"><input type="checkbox" data-k="${esc(k)}" ${ticks[k] ? "checked" : ""}><span class="n">${i + 1}</span><p>${hl(c, j.words)}</p><span class="tag">${j.tag}</span></label>`;
  };
  const idx = g.items.map((_, i) => i), mine = idx.filter(i => !HUMAN.test(g.items[i])), yours = idx.filter(i => HUMAN.test(g.items[i]));
  const group = (title, say, ids, cls) => `<div class="grp ${cls}"><h3>${title} <span>${ids.length}</span></h3><p class="key">${say}</p>${ids.length ? ids.map(row).join("") : `<p class="empty">None.</p>`}</div>`;
  $("clauses").innerHTML = g.items.length
    ? `<p class="key">Tick each point you could check yourself. <b class="k clear">Clear</b> has a number. <b class="k check">Check</b> has none. <b class="k vague">Vague</b> could be argued.</p><div class="split">`
      + group("Claude can finish alone", "Claude does the work and shows the proof in the chat.", mine, "auto")
      + group("Needs you", "Claude stops and asks you when only these are left.", yours, "human")
      + `</div>`
    : `<p class="empty">No finish line found. Add a "DONE WHEN:" list with numbered points.</p>`;
  const list = (s, el) => { const xs = s.split(/(?<=\.)\s+(?=[A-Z])/).map(x => x.trim()).filter(Boolean); $(el).innerHTML = xs.length ? xs.map(x => `<li>${esc(x)}</li>`).join("") : `<li class="empty">None given.</li>`; };
  list(g.how, "rules"); list(g.never, "never");
  document.querySelectorAll("input[data-k]").forEach(b => b.onchange = () => { ticks[b.dataset.k] = b.checked; save(); verdict(g, ps, js, len); });
  verdict(g, ps, js, len);
}

function verdict(g, ps, js, len) {
  const why = [];
  if (len > 4000) why.push("Shorten it to 4,000 characters or less.");
  ps.filter(p => !p.ok && !p.optional).forEach(p => why.push(`Missing: ${p.name.toLowerCase()}.`));
  const bad = js.filter(j => j.cls === "vague" || j.cls === "escape").length;
  if (bad) why.push(`${bad} point${bad > 1 ? "s" : ""} marked Vague or Way out.`);
  if (g.items.some(c => HUMAN.test(c)) && !g.blocked) why.push("Some points need you, but the goal never says when to stop and ask.");
  const blind = g.items.filter(c => proof(c).who === "none").length;
  if (blind) why.push(`${blind} point${blind > 1 ? "s" : ""} put no proof in the chat, so the checker cannot close ${blind > 1 ? "them" : "it"}.`);
  const un = g.items.filter(c => !ticks[c.slice(0, 80)]).length;
  if (un) why.push(`${un} point${un > 1 ? "s" : ""} not ticked yet.`);
  const ok = !why.length;
  $("stamp").className = "stamp " + (ok ? "ok" : "no");
  $("stamp").textContent = ok ? "Ready To Start" : "Not Ready";
  $("why").innerHTML = ok ? "<p>Every point is clear and ticked. Paste it into /goal.</p>" : why.map(w => `<p>${w}</p>`).join("");
}

$("go").onclick = render;
$("ex").onclick = () => { $("src").value = EXAMPLE; render(); };
$("clr").onclick = () => { $("src").value = ""; render(); };
let t; $("src").addEventListener("input", () => { clearTimeout(t); t = setTimeout(render, 300); });
$("src").value = EXAMPLE; render();

// Session mode. A per-goal copy of this page keeps the goal in its db store. Claude writes the
// goal, the grill questions and the versions. People answer, propose changes and lock it here.
const S = {db: null, user: null, me: null, goal: null, qs: [], vs: [], props: [], names: {}, draft: {}, entered: false, err: ""};
const iso = () => new Date().toISOString();
const byKey = k => (a, b) => (a[k] ?? 0) - (b[k] ?? 0);
const who = id => id ? (S.names[id] || "Someone") : "Someone";
const canWrite = () => !S.user || !S.user.can || S.user.can("data.write") !== false;

async function boot() {
  if (!window.claude || typeof claude.use !== "function") return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch (e) { return; }
  if (!db) return;
  S.db = db; S.user = user;
  try { S.me = user ? await user.id() : null; } catch (e) { S.me = null; }
  const fail = e => { S.err = "The goal store did not answer: " + (e && e.code || "unknown") + "."; drawSession(); };
  db.doc("goal/current").onSnapshot(snap => {
    if (!snap.exists) return;
    S.goal = snap.data(); enterSession(); drawSession(); names();
  }, fail);
  db.collection("questions").onSnapshot(s => { S.qs = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (a.round - b.round) || (a.n - b.n)); drawSession(); names(); }, fail);
  db.collection("versions").onSnapshot(s => { S.vs = s.docs.map(d => ({id: d.id, ...d.data()})).sort(byKey("version")).reverse(); drawSession(); }, fail);
  db.collection("proposals").onSnapshot(s => { S.props = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => String(a.at).localeCompare(String(b.at))); drawSession(); names(); }, fail);
}

async function names() {
  if (!S.user || !S.user.profiles) return;
  const ids = [...new Set([...S.qs.map(q => q.answeredBy), ...S.props.map(p => p.by), S.goal && S.goal.lockedBy].filter(Boolean))].filter(id => !(id in S.names));
  if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); ids.forEach(id => { S.names[id] = (ps[id] && ps[id].name) || ""; }); drawSession(); } catch (e) {}
}

function enterSession() {
  if (S.entered) return;
  S.entered = true;
  $("sess").hidden = false;
  ["go", "ex", "clr"].forEach(id => { $(id).hidden = true; });
  $("src").readOnly = true;
}

function stepsHtml(st) {
  const order = ["grilling", "locked", "final", "go"], at = order.indexOf(st);
  const label = {grilling: "1 Grill and tune", locked: "2 Locked", final: "3 Final", go: "4 You start it"};
  return `<ol class="steps">${order.map((k, i) => `<li class="${i < at ? "done" : i === at ? "on" : ""}">${label[k]}</li>`).join("")}</ol>`;
}

function qHtml(q, live) {
  const head = `<b>${q.n}. ${esc(q.text || "")}</b>${q.why ? `<p class="qwhy">${esc(q.why)}</p>` : ""}`;
  if (q.answer) {
    const by = q.answeredVia === "chat" ? "answered in the chat" : "answered by " + esc(who(q.answeredBy));
    return `<div class="q done">${head}<p class="ans">✓ ${esc(q.answer)} <span>· ${by}</span></p>${live && canWrite() ? `<div><button data-reopen="${q.id}">Change answer</button></div>` : ""}</div>`;
  }
  if (!live) return `<div class="q open">${head}<p class="empty">Not answered.</p></div>`;
  const opts = [q.recommended, ...(q.options || []).filter(o => o !== q.recommended)].filter(Boolean);
  const d = S.draft[q.id] || {};
  const radios = opts.map((o, i) => `<label class="opt"><input type="radio" name="q-${q.id}" value="${i}" ${String(d.pick) === String(i) ? "checked" : ""}><span>${esc(o)}${o === q.recommended ? `<span class="rec">Recommended</span>` : ""}</span></label>`).join("");
  return `<div class="q open" data-q="${q.id}">${head}${radios}
    <label class="opt"><input type="radio" name="q-${q.id}" value="other" ${d.pick === "other" ? "checked" : ""}><span>Other</span></label>
    <input type="text" data-other="${q.id}" placeholder="Your answer" value="${esc(d.other || "")}">
    <div class="row">${canWrite() ? `<button class="main" data-save="${q.id}">Save answer</button>` : `<span class="empty">You can read this page but not answer.</span>`}</div></div>`;
}

function drawSession() {
  if (!S.entered || !S.goal) { if (S.err) { $("sess").hidden = false; $("sess").innerHTML = `<p class="err">${esc(S.err)}</p>`; } return; }
  const g = S.goal, st = g.status || "grilling", round = g.round || 0;
  if (g.work) { document.querySelector("h1").textContent = g.title || g.work; document.querySelector(".sub").textContent = "Goal session for " + g.work + ". Grill and tune the goal here. A person starts it."; }
  const text = st === "final" && g.finalText ? g.finalText : (g.text || "");
  if ($("src").value !== text) { $("src").value = text; render(); }
  $("srch").textContent = st === "final" ? "The final goal" : `The goal, version ${g.version || 1}`;
  const cur = S.qs.filter(q => q.round === round), open = cur.filter(q => !q.answer).length;
  const earlier = S.qs.filter(q => q.round < round), pending = S.props.filter(p => !p.applied);
  let banner;
  if (st === "final") banner = `<div class="banner good"><span>Final. Copy it and paste it into /goal yourself. Claude does not start the goal.</span></div>`;
  else if (st === "locked") banner = `<div class="banner"><span>Locked by ${esc(who(g.lockedBy))}. Tell Claude "finalize" in the chat.</span>${canWrite() ? `<button data-unlock>Unlock</button>` : ""}</div>`;
  else if (open) banner = `<div class="banner"><span>Round ${round}: ${open} question${open > 1 ? "s" : ""} open. Answer here or in the chat.</span></div>`;
  else if (cur.length || pending.length) banner = `<div class="banner"><span>Round ${round} is answered. Tell Claude "next round" in the chat, or lock the goal if nothing is left.</span>${canWrite() ? `<button data-lock>Lock the goal</button>` : ""}</div>`;
  else banner = `<div class="banner good"><span>No open questions. Lock the goal, or propose a change below.</span>${canWrite() ? `<button class="main" data-lock>Lock the goal</button>` : ""}</div>`;
  const live = st === "grilling";
  const qsec = cur.length ? `<h2>Round ${round} questions</h2><div class="qs">${cur.map(q => qHtml(q, live)).join("")}</div>` : "";
  const old = earlier.length ? `<details><summary>Earlier rounds (${earlier.length} questions)</summary><div class="qs" style="margin-top:8px">${earlier.map(q => qHtml(q, false)).join("")}</div></details>` : "";
  const props = live ? `<div class="prop"><h2>Propose a change</h2>
    ${pending.length ? `<ul class="vers">${pending.map(p => `<li>${esc(p.text || "")} <small>· ${esc(who(p.by))}, waits for the next round</small></li>`).join("")}</ul>` : ""}
    ${canWrite() ? `<textarea id="ptext" placeholder="What should the goal say differently?">${esc(S.draft.prop || "")}</textarea><div class="row" style="margin-top:8px"><button data-propose>Add proposal</button></div>` : ""}</div>` : "";
  const fin = st === "final" && g.finalText ? `<h2>Copy and start</h2><pre class="final" id="fintext">${esc(g.finalText)}</pre>
    <div class="row"><button class="main" data-copy>Copy goal</button><span class="empty">${(g.finalText.length).toLocaleString()} of 4,000 characters</span></div>` : "";
  const vers = S.vs.length ? `<details><summary>Versions (${S.vs.length})</summary><ul class="vers" style="margin-top:8px">${S.vs.map(v => `<li><b>v${v.version}</b> <small>round ${v.round ?? "?"}</small><br>${esc((v.changes || []).join(" ") || "First draft.")}</li>`).join("")}</ul></details>` : "";
  $("sess").innerHTML = `<h2>Goal session</h2>${stepsHtml(st)}${banner}${S.err ? `<p class="err">${esc(S.err)}</p>` : ""}${fin}${qsec}${props}${old}${vers}`;
}

async function write(fn) {
  S.err = "";
  try { await fn(); } catch (e) { S.err = e && e.code === "not_granted" ? "You do not have write access to this page." : "The save failed. Try again."; drawSession(); }
}

$("sess").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.other) { const d = S.draft[t.dataset.other] = S.draft[t.dataset.other] || {}; d.other = t.value; d.pick = "other"; const r = document.querySelector(`input[name="q-${t.dataset.other}"][value="other"]`); if (r) r.checked = true; }
  else if (t.type === "radio" && t.name.startsWith("q-")) { const id = t.name.slice(2); (S.draft[id] = S.draft[id] || {}).pick = t.value; }
  else if (t.id === "ptext") S.draft.prop = t.value;
});

$("sess").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || !S.db) return;
  const d = b.dataset;
  if (d.save) {
    const q = S.qs.find(x => x.id === d.save), dr = S.draft[d.save] || {};
    const opts = [q.recommended, ...(q.options || []).filter(o => o !== q.recommended)].filter(Boolean);
    const answer = dr.pick === "other" ? (dr.other || "").trim() : opts[Number(dr.pick)];
    if (!answer) { S.err = "Pick an answer, or type one under Other."; drawSession(); return; }
    write(() => S.db.doc("questions/" + d.save).update({answer, answeredBy: S.me, answeredVia: "page", answeredAt: iso()})).then(() => { delete S.draft[d.save]; });
  } else if (d.reopen) {
    write(() => S.db.doc("questions/" + d.reopen).update({answer: "", answeredBy: null, answeredVia: null, answeredAt: null}));
  } else if ("propose" in d) {
    const text = (S.draft.prop || "").trim();
    if (!text) return;
    write(() => S.db.collection("proposals").add({text, by: S.me, at: iso(), round: S.goal.round || 0, applied: false})).then(() => { S.draft.prop = ""; drawSession(); });
  } else if ("lock" in d) {
    write(() => S.db.doc("goal/current").update({status: "locked", lockedBy: S.me, lockedAt: iso()}));
  } else if ("unlock" in d) {
    write(() => S.db.doc("goal/current").update({status: "grilling", lockedBy: null, lockedAt: null}));
  } else if ("copy" in d) {
    const txt = S.goal.finalText || "";
    const done = () => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy goal"; }, 1500); };
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(done, () => { const r = document.createRange(); r.selectNodeContents($("fintext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected: press copy"; });
  }
});

boot();
</script>
