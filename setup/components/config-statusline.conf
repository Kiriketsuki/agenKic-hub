# Component manifest. Flat key=value, parsed by setup.sh and setup.ps1.
# Pointer component. It installs nothing: config/statusline holds only a
# README, and the install type skips README.md by design. For a real
# install, select ext-statusline instead. That component clones
# Kiriketsuki/chrysaki-claude and runs the repo's own init.sh.
name=config-statusline
desc=Statusline notes only. Select ext-statusline for the real install
type=install
source=config/statusline
target=~/.claude/statusline
