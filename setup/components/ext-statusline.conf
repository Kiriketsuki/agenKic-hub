# Component manifest. Flat key=value, parsed by setup.sh and setup.ps1.
# External component. The installer clones the sibling repo, then delegates.
name=ext-statusline
desc=Clone chrysaki-claude and run its init.sh to install the Claude Code statusline
type=external
repo=Kiriketsuki/chrysaki-claude
clone_to=~/.local/share/chrysaki-claude
method=script
run=init.sh
