# Component manifest. Flat key=value, parsed by setup.sh and setup.ps1.
# External component. The chrysaki repo ships no installer script, so this
# component clones only. The rendered tmux.conf sources the theme file through
# the {{tmux_theme_conf}} variable, guarded by an if-shell file test.
name=ext-tmux-theme
desc=Clone the chrysaki theme into ~/.config/tmux/chrysaki. Clone only, the tmux.conf source line activates it
type=external
repo=Kiriketsuki/chrysaki
clone_to=~/.config/tmux/chrysaki
method=clone
run=
