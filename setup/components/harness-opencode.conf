# Component manifest. Flat key=value, parsed by setup.sh and setup.ps1.
# Scaffold only for now. Installer no-ops until real files land in harnesses/opencode/.
# Windows note: the README documents %APPDATA%\opencode. Adjust target when files land.
name=harness-opencode
desc=Install OpenCode harness files into ~/.config/opencode
type=install
source=harnesses/opencode
target=~/.config/opencode
